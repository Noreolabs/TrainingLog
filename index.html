<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14161A">
<title>Rep Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rep Log">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="offline-banner" class="offline-banner hidden">You're offline — logging still works, it'll all be here.</div>

<header class="app-header">
  <div class="app-header-row">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">REP LOG</span>
    </div>
    <div class="plan-badge" id="plan-badge">—</div>
  </div>
</header>

<main id="view-root" class="view-root">
  <!-- Views are rendered here by app.js -->
</main>

<nav class="tab-bar" id="tab-bar">
  <button class="tab-btn" data-tab="today" aria-label="Today">
    <svg viewBox="0 0 24 24" class="tab-icon"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5L19 19M19 5l-2.5 2.5M7.5 16.5L5 19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
    <span>Today</span>
  </button>
  <button class="tab-btn" data-tab="week" aria-label="Week">
    <svg viewBox="0 0 24 24" class="tab-icon"><rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span>Week</span>
  </button>
  <button class="tab-btn" data-tab="history" aria-label="History">
    <svg viewBox="0 0 24 24" class="tab-icon"><path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M3 4v5h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span>History</span>
  </button>
  <button class="tab-btn" data-tab="export" aria-label="Export">
    <svg viewBox="0 0 24 24" class="tab-icon"><path d="M12 3v12M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span>Export</span>
  </button>
  <button class="tab-btn" data-tab="plan" aria-label="Plan">
    <svg viewBox="0 0 24 24" class="tab-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M14 2v6h6M9 13h6M9 17h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span>Plan</span>
  </button>
</nav>

<div id="toast" class="toast hidden"></div>

<div id="day-picker-overlay" class="day-picker-overlay hidden">
  <div class="day-picker-sheet">
    <div class="day-picker-header">
      <span>Choose a day to log</span>
      <button type="button" id="day-picker-close" class="day-picker-close" aria-label="Close">✕</button>
    </div>
    <div id="day-picker-list" class="day-picker-list"></div>
  </div>
</div>

<script src="plan-data.js"></script>
<script src="app.js"></script>
</body>
</html>
